[profile.default]
src              = "src"
out              = "out"
libs             = ["lib"]
test             = "test"
script           = "script"
solc             = "0.8.26"
evm_version      = "shanghai"
optimizer        = true
optimizer_runs   = 200
via_ir           = false
bytecode_hash    = "none"
cbor_metadata    = false
verbosity        = 1
gas_reports      = ["VaultInheritance"]
fs_permissions   = [{ access = "read-write", path = "./deployments" }]

# Deterministic fuzzing so a CI failure is reproducible locally.
[fuzz]
runs       = 512
seed       = "0x5641554c54"   # "VAULT"

[invariant]
runs                  = 64
depth                 = 256
fail_on_revert        = false
call_override         = false
shrink_run_limit      = 2000

# Network configuration lives in config/networks.json and is mirrored here for
# forge's --rpc-url shorthand. Values verified against the official Robinhood
# Chain documentation and the live RPCs — see ROBINHOOD_CHAIN.md.
[rpc_endpoints]
anvil              = "http://127.0.0.1:8545"
robinhood          = "${RH_MAINNET_RPC_URL}"
robinhood_testnet  = "${RH_TESTNET_RPC_URL}"

[etherscan]
# Blockscout verification; no API key required on either network.
robinhood         = { key = "", chain = 4663,  url = "https://robinhoodchain.blockscout.com/api/" }
robinhood_testnet = { key = "", chain = 46630, url = "https://explorer.testnet.chain.robinhood.com/api/" }

[fmt]
line_length      = 100
tab_width        = 4
bracket_spacing  = false
int_types        = "long"

[lint]
# Every one of these was reviewed individually rather than silenced wholesale;
# the reasoning is recorded in SECURITY_REVIEW.md.
#
#  block-timestamp   — the protocol is timestamp-driven BY DESIGN (a dead-man's
#                      switch measured in days/years). Sequencer drift of seconds
#                      is immaterial at that scale, and `block.number` is NOT an
#                      option on an Arbitrum chain (it returns an L1 estimate).
#  unsafe-typecast   — all 13 sites audited: uint40(timestamp) is safe to the
#                      year 36812; the two threshold casts are guarded by an
#                      explicit `> type(uint40).max` check; uint248(amount) is
#                      guarded the same way; every uint32/uint16/uint8 length
#                      cast is bounded by MAX_CUSTODIANS/MAX_BENEFICIARIES/
#                      MAX_ACTIVE_MEDIA/MAX_TOKEN_VAULTS.
#  uninitialized-local — `for (uint256 i; ...)` is the idiomatic zero-init form.
#  asm-keccak256     — readability beats ~30 gas on paths called a few times per
#                      will over its entire lifetime.
#  boolean-cst       — returning a literal `(false, 0)` / `(true, n)` tuple.
#  missing-events-access-control — false positive; `_cidIndex` is a lookup index,
#                      not an authorization record.
exclude_lints = [
    "block-timestamp",
    "unsafe-typecast",
    "uninitialized-local",
    "asm-keccak256",
    "boolean-cst",
    "missing-events-access-control",
]
